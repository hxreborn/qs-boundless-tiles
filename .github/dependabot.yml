version: 2

updates:
  - package-ecosystem: "gradle"
    commit-message:
      prefix: "ci(deps)"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      libxposed:
        patterns:
          - "io.github.libxposed*"

  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "ci(deps)"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
